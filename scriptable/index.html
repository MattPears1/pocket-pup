<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Pup Scriptable Widget</title>
    <style>
      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        background: #f6edd9;
        color: #241b16;
        font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      img {
        display: block;
        max-width: 180px;
        margin: 0 auto 1.5rem;
      }
      a {
        color: #b94a27;
        font-weight: 700;
      }
      button {
        width: 100%;
        min-height: 52px;
        margin: 0.5rem 0 1rem;
        border: 0;
        border-radius: 12px;
        background: #b94a27;
        color: white;
        font: 700 17px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button:active {
        transform: translateY(1px);
      }
      .status {
        min-height: 1.5rem;
        color: #5f533f;
        font-size: 0.95rem;
      }
      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <img src="./assets/dog-idle.png" alt="Pocket Pup dog" />
    <h1>Pocket Pup Scriptable Widget</h1>
    <p>Install Scriptable from the App Store, create a new script named Pocket Pup, then paste the script.</p>
    <button id="copyScript" type="button">Copy Script</button>
    <p id="copyStatus" class="status" role="status"></p>
    <p><a href="./pocket-pup-widget.js">Open the Pocket Pup widget script</a></p>
    <p>After saving it in Scriptable, add a Scriptable widget to your Home Screen or Lock Screen and choose the Pocket Pup script.</p>
    <script>
      const button = document.getElementById("copyScript");
      const status = document.getElementById("copyStatus");

      button.addEventListener("click", async () => {
        try {
          const response = await fetch("./pocket-pup-widget.js", { cache: "no-store" });
          const script = await response.text();
          await navigator.clipboard.writeText(script);
          status.textContent = "Copied. Open Scriptable, tap +, then paste.";
        } catch (error) {
          status.textContent = "Copy failed. Open the script link and use Select All > Copy.";
        }
      });
    </script>
  </body>
</html>
